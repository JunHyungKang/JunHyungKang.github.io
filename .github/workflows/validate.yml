name: Validate blog
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:export
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
