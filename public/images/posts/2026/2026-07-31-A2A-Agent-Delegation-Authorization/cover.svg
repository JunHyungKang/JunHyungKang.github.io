<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">사용자 승인을 회수했지만 A2A Task는 계속 실행됐다</title>
  <desc id="desc">승인은 중간에 회수됐지만 A2A Task는 계속 실행돼 모의 ERP에 주문 기록을 남기고 완료 상태가 되는 시간 흐름을 보여준다.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="30" x2="1140" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182C"/>
      <stop offset="1" stop-color="#102B46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020B14" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#48BDEB"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1082" cy="70" r="170" fill="#2975A6" fill-opacity="0.16"/>
  <circle cx="82" cy="600" r="190" fill="#25B7AD" fill-opacity="0.08"/>

  <text x="72" y="82" fill="#7EE7DF" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" letter-spacing="1.3">A2A v1.0 × TASK LIFECYCLE</text>
  <text x="72" y="142" fill="#F5F8FC" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="750">사용자 승인을 회수했지만</text>
  <text x="72" y="196" fill="#F5F8FC" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="750">A2A Task는 계속 실행됐다</text>
  <text x="72" y="235" fill="#9FB7CA" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">승인 회수, CancelTask, 보상 작업은 서로 다른 동작이다</text>

  <g filter="url(#shadow)">
    <rect x="72" y="278" width="1056" height="270" rx="24" fill="#0C2239" stroke="#244562"/>
  </g>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="104" y="329" fill="#A9BDD0" font-size="16" font-weight="700">승인</text>
    <rect x="218" y="306" width="276" height="40" rx="20" fill="#183F36" stroke="#2A8C70"/>
    <text x="356" y="332" fill="#8DE3C7" font-size="15" font-weight="700" text-anchor="middle">ACTIVE</text>
    <rect x="494" y="306" width="202" height="40" rx="20" fill="#4B2630" stroke="#C65A6B"/>
    <text x="595" y="332" fill="#FFB1BC" font-size="15" font-weight="700" text-anchor="middle">REVOKED</text>

    <line x1="494" y1="294" x2="494" y2="520" stroke="#FF6F83" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="419" y="365" width="150" height="31" rx="15.5" fill="#5A2A35"/>
    <text x="494" y="386" fill="#FFC0C9" font-size="14" font-weight="700" text-anchor="middle">승인 회수</text>

    <text x="104" y="445" fill="#A9BDD0" font-size="16" font-weight="700">A2A Task</text>
    <line x1="218" y1="438" x2="956" y2="438" stroke="#48BDEB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <rect x="240" y="413" width="138" height="34" rx="17" fill="#153955"/>
    <text x="309" y="436" fill="#A9E3FA" font-size="14" font-weight="700" text-anchor="middle">WORKING</text>
    <rect x="848" y="413" width="145" height="34" rx="17" fill="#153955"/>
    <text x="920" y="436" fill="#A9E3FA" font-size="14" font-weight="700" text-anchor="middle">COMPLETED</text>

    <rect x="748" y="474" width="277" height="48" rx="14" fill="#553D20" stroke="#B78132"/>
    <text x="886" y="504" fill="#FFD98B" font-size="16" font-weight="750" text-anchor="middle">ORDER_CREATED · 모의 ERP</text>

    <path d="M595 352C650 372 665 405 710 428" stroke="#FF8A9A" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="628" y="371" fill="#FFB1BC" font-size="14" font-weight="650">자동 취소 없음</text>
  </g>
</svg>
