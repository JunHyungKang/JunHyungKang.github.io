<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">모든 Agent를 중앙 AX팀이 만들 필요는 없다</title>
  <desc id="desc">모든 업무 변경이 중앙팀 대기열을 통과하는 구조와 중앙팀이 공통 실행 기반을 제공하고 업무팀이 업무 규칙과 운영 결과를 소유하는 구조를 비교한다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101F"/>
      <stop offset="1" stop-color="#111C35"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .headline { fill: #F8FAFC; font-size: 43px; font-weight: 760; letter-spacing: -1.4px; }
      .subtitle { fill: #A9B7CF; font-size: 20px; font-weight: 520; letter-spacing: -0.3px; }
      .panel-title { fill: #F8FAFC; font-size: 24px; font-weight: 720; }
      .panel-note { fill: #94A3B8; font-size: 16px; font-weight: 520; }
      .card-title { fill: #F8FAFC; font-size: 19px; font-weight: 700; }
      .card-note { fill: #CBD5E1; font-size: 15px; font-weight: 520; }
      .small { fill: #CBD5E1; font-size: 16px; font-weight: 540; }
      .platform-title { fill: #FFFFFF; font-size: 22px; font-weight: 740; }
      .platform-note { fill: #E0E7FF; font-size: 16px; font-weight: 560; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#background)"/>

  <text x="64" y="72" class="headline">모든 Agent를 중앙 AX팀이 만들 필요는 없다</text>
  <text x="64" y="110" class="subtitle">중앙팀은 공통 기반을, 업무팀은 규칙과 운영 결과를 맡는다</text>

  <rect x="48" y="154" width="510" height="508" rx="24" fill="#111827" stroke="#334155"/>
  <text x="78" y="199" class="panel-title">모든 Agent를 중앙에서 구현</text>
  <text x="78" y="229" class="panel-note">정책 변경마다 같은 작업 대기열을 다시 거친다</text>

  <g filter="url(#shadow)">
    <rect x="78" y="270" width="132" height="78" rx="15" fill="#172033" stroke="#64748B"/>
    <rect x="237" y="270" width="132" height="78" rx="15" fill="#172033" stroke="#64748B"/>
    <rect x="396" y="270" width="132" height="78" rx="15" fill="#172033" stroke="#64748B"/>
  </g>
  <text x="144" y="302" class="card-title" text-anchor="middle">업무 A</text>
  <text x="144" y="329" class="card-note" text-anchor="middle">규칙 변경</text>
  <text x="303" y="302" class="card-title" text-anchor="middle">업무 B</text>
  <text x="303" y="329" class="card-note" text-anchor="middle">예외 추가</text>
  <text x="462" y="302" class="card-title" text-anchor="middle">업무 C</text>
  <text x="462" y="329" class="card-note" text-anchor="middle">운영 개선</text>

  <path d="M144 357V402H247" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M303 357V402" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M462 357V402H359" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="144" y="414" width="318" height="112" rx="20" fill="#3A1727" stroke="#FB7185" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="303" y="455" class="card-title" text-anchor="middle">중앙팀 작업 대기열</text>
  <text x="303" y="486" class="small" text-anchor="middle">설명 → 구현 → 검수 → 재작업</text>
  <text x="303" y="511" class="card-note" text-anchor="middle">Agent가 늘수록 변경 대기시간 증가</text>

  <path d="M303 536V573" fill="none" stroke="#FB7185" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="117" y="585" width="372" height="48" rx="14" fill="#172033" stroke="#475569"/>
  <text x="303" y="616" class="small" text-anchor="middle">중앙팀이 구현과 운영까지 함께 소유</text>

  <rect x="590" y="154" width="562" height="508" rx="24" fill="#111827" stroke="#334155"/>
  <text x="620" y="199" class="panel-title">공통 기반 위에서 업무팀이 운영</text>
  <text x="620" y="229" class="panel-note">중앙팀은 안전한 경로를 만들고 업무팀은 결과를 책임진다</text>

  <g filter="url(#shadow)">
    <rect x="620" y="270" width="154" height="150" rx="18" fill="#172033" stroke="#38BDF8"/>
    <rect x="794" y="270" width="154" height="150" rx="18" fill="#172033" stroke="#38BDF8"/>
    <rect x="968" y="270" width="154" height="150" rx="18" fill="#172033" stroke="#38BDF8"/>
  </g>
  <text x="697" y="306" class="card-title" text-anchor="middle">업무 Agent A</text>
  <text x="697" y="339" class="card-note" text-anchor="middle">규칙 · 지식</text>
  <text x="697" y="365" class="card-note" text-anchor="middle">예외 · 운영</text>
  <text x="697" y="400" class="card-note" text-anchor="middle" fill="#7DD3FC">업무팀 소유</text>

  <text x="871" y="306" class="card-title" text-anchor="middle">업무 Agent B</text>
  <text x="871" y="339" class="card-note" text-anchor="middle">규칙 · 지식</text>
  <text x="871" y="365" class="card-note" text-anchor="middle">예외 · 운영</text>
  <text x="871" y="400" class="card-note" text-anchor="middle" fill="#7DD3FC">업무팀 소유</text>

  <text x="1045" y="306" class="card-title" text-anchor="middle">업무 Agent C</text>
  <text x="1045" y="339" class="card-note" text-anchor="middle">규칙 · 지식</text>
  <text x="1045" y="365" class="card-note" text-anchor="middle">예외 · 운영</text>
  <text x="1045" y="400" class="card-note" text-anchor="middle" fill="#7DD3FC">업무팀 소유</text>

  <path d="M697 430V467" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M871 430V467" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1045 430V467" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="620" y="480" width="502" height="124" rx="20" fill="url(#platform)" filter="url(#shadow)"/>
  <text x="871" y="520" class="platform-title" text-anchor="middle">중앙 기술 조직의 공통 실행 기반</text>
  <text x="871" y="554" class="platform-note" text-anchor="middle">Identity · Connector · Eval · Guardrail</text>
  <text x="871" y="582" class="platform-note" text-anchor="middle">Observability · Runtime · Registry</text>

  <rect x="695" y="619" width="352" height="28" rx="14" fill="#172554" stroke="#60A5FA"/>
  <text x="871" y="639" class="card-note" text-anchor="middle" fill="#BFDBFE">위험이 높을수록 중앙 검토를 강화</text>
</svg>
