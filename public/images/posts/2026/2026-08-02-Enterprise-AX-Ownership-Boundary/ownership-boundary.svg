<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">중앙 AX팀과 도메인 팀의 소유권 경계</title>
  <desc id="desc">모든 업무 변경이 중앙 AX팀의 대기열을 통과하는 구조와, 중앙팀이 공통 실행 기반을 제공하고 각 도메인 팀이 업무 Agent를 운영하는 구조를 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111B34"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .heading { fill: #F8FAFC; font-size: 31px; font-weight: 750; }
      .sub { fill: #94A3B8; font-size: 16px; font-weight: 500; }
      .panel-title { fill: #E2E8F0; font-size: 21px; font-weight: 700; }
      .label { fill: #F8FAFC; font-size: 17px; font-weight: 700; }
      .small { fill: #CBD5E1; font-size: 14px; font-weight: 500; }
      .tiny { fill: #94A3B8; font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="heading">Agent 납품 조직에서 공통 기반과 도메인 소유 구조로</text>
  <text x="64" y="98" class="sub">새 AX 프로젝트에서 먼저 정할 것은 Agent 수가 아니라 변경과 운영의 소유권이다.</text>

  <rect x="48" y="136" width="510" height="526" rx="24" fill="#111827" stroke="#334155"/>
  <text x="76" y="178" class="panel-title">모든 Agent를 중앙팀이 만드는 구조</text>
  <text x="76" y="205" class="tiny">업무 변경과 예외가 하나의 대기열을 통과한다</text>

  <g filter="url(#shadow)">
    <rect x="76" y="242" width="126" height="74" rx="14" fill="#172033" stroke="#475569"/>
    <rect x="240" y="242" width="126" height="74" rx="14" fill="#172033" stroke="#475569"/>
    <rect x="404" y="242" width="126" height="74" rx="14" fill="#172033" stroke="#475569"/>
  </g>
  <text x="139" y="274" class="label" text-anchor="middle">구매팀</text>
  <text x="139" y="297" class="tiny" text-anchor="middle">규정·예외</text>
  <text x="303" y="274" class="label" text-anchor="middle">인사팀</text>
  <text x="303" y="297" class="tiny" text-anchor="middle">정책·지식</text>
  <text x="467" y="274" class="label" text-anchor="middle">재무팀</text>
  <text x="467" y="297" class="tiny" text-anchor="middle">승인·마감</text>

  <path d="M139 320 V367 H260" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M303 320 V367" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M467 320 V367 H346" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="166" y="376" width="274" height="108" rx="18" fill="#3B1726" stroke="#FB7185" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="303" y="412" class="label" text-anchor="middle">중앙 AX팀 작업 대기열</text>
  <text x="303" y="440" class="small" text-anchor="middle">설명 → 구현 → 검수 → 재작업</text>
  <text x="303" y="464" class="tiny" text-anchor="middle">모든 업무 변경의 공통 병목</text>

  <path d="M303 488 V528" fill="none" stroke="#FB7185" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="104" y="540" width="398" height="76" rx="16" fill="#172033" stroke="#475569"/>
  <text x="303" y="571" class="label" text-anchor="middle">업무별 Agent 구현과 운영</text>
  <text x="303" y="596" class="small" text-anchor="middle">Agent가 늘수록 중앙팀의 전달 비용도 증가</text>

  <rect x="590" y="136" width="562" height="526" rx="24" fill="#111827" stroke="#334155"/>
  <text x="618" y="178" class="panel-title">공통 기반 위에서 도메인이 운영하는 구조</text>
  <text x="618" y="205" class="tiny">중앙팀은 안전한 경로를 만들고 도메인은 업무 결과를 소유한다</text>

  <g filter="url(#shadow)">
    <rect x="618" y="244" width="154" height="144" rx="17" fill="#172033" stroke="#38BDF8"/>
    <rect x="794" y="244" width="154" height="144" rx="17" fill="#172033" stroke="#38BDF8"/>
    <rect x="970" y="244" width="154" height="144" rx="17" fill="#172033" stroke="#38BDF8"/>
  </g>
  <text x="695" y="277" class="label" text-anchor="middle">구매 Agent</text>
  <text x="695" y="309" class="small" text-anchor="middle">목표·규정</text>
  <text x="695" y="332" class="small" text-anchor="middle">예외·운영</text>
  <text x="695" y="364" class="tiny" text-anchor="middle">구매팀 소유</text>

  <text x="871" y="277" class="label" text-anchor="middle">인사 Agent</text>
  <text x="871" y="309" class="small" text-anchor="middle">목표·지식</text>
  <text x="871" y="332" class="small" text-anchor="middle">예외·운영</text>
  <text x="871" y="364" class="tiny" text-anchor="middle">인사팀 소유</text>

  <text x="1047" y="277" class="label" text-anchor="middle">재무 Agent</text>
  <text x="1047" y="309" class="small" text-anchor="middle">목표·승인</text>
  <text x="1047" y="332" class="small" text-anchor="middle">예외·운영</text>
  <text x="1047" y="364" class="tiny" text-anchor="middle">재무팀 소유</text>

  <path d="M695 400 V445" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M871 400 V445" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1047 400 V445" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="618" y="458" width="506" height="128" rx="20" fill="url(#platform)" filter="url(#shadow)"/>
  <text x="871" y="493" class="label" text-anchor="middle">중앙 AX팀의 공통 실행 기반</text>
  <text x="871" y="525" class="small" text-anchor="middle">Identity · Tool/Connector · Eval · Observability</text>
  <text x="871" y="551" class="small" text-anchor="middle">Runtime · Release gate · Cost policy · Registry</text>
  <text x="871" y="574" class="tiny" text-anchor="middle" fill="#DBEAFE">guardrail 안의 변경은 도메인이 직접 수행</text>

  <rect x="700" y="609" width="342" height="30" rx="15" fill="#172554" stroke="#60A5FA"/>
  <text x="871" y="630" class="tiny" text-anchor="middle" fill="#BFDBFE">위험이 높을수록 중앙 설계·출시 gate 강화</text>
</svg>
