<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FastMCP import 경로별 MCP Python SDK v2 대응 방법</title>
  <desc id="desc">mcp.server.fastmcp를 사용하면 mcp 버전을 2 미만으로 고정한 뒤 MCPServer로 이관하고, standalone fastmcp를 사용하면 정확한 FastMCP 3 버전을 고정한 뒤 v4 stable을 기다리는 흐름을 보여준다.</desc>
  <defs>
    <linearGradient id="background" x1="75" y1="40" x2="1120" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182E"/>
      <stop offset="1" stop-color="#10294A"/>
    </linearGradient>
    <linearGradient id="line" x1="205" y1="0" x2="995" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59D8FF"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000B18" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59D8FF"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9B8CFF"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#background)"/>
  <circle cx="1100" cy="70" r="170" fill="#6C63FF" fill-opacity="0.08"/>
  <circle cx="70" cy="730" r="190" fill="#00C2FF" fill-opacity="0.07"/>

  <text x="70" y="69" fill="#76DFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" letter-spacing="2">MIGRATION DECISION</text>
  <text x="70" y="125" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="42" font-weight="800">FastMCP라는 이름보다 import 경로를 먼저 본다</text>

  <g filter="url(#shadow)">
    <rect x="410" y="170" width="380" height="74" rx="18" fill="#183553" stroke="#4C7198"/>
  </g>
  <text x="600" y="216" text-anchor="middle" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="700">현재 코드의 import는?</text>

  <path d="M600 244V278H285V316" stroke="#59D8FF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M600 244V278H915V316" stroke="#9B8CFF" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g filter="url(#shadow)">
    <rect x="75" y="320" width="420" height="117" rx="20" fill="#0F2C49" stroke="#3A7392"/>
    <rect x="705" y="320" width="420" height="117" rx="20" fill="#1B294D" stroke="#675D9C"/>
  </g>
  <text x="285" y="361" text-anchor="middle" fill="#80E4FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">mcp.server.fastmcp</text>
  <text x="285" y="399" text-anchor="middle" fill="#BDD1E7" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20">공식 MCP Python SDK v1</text>
  <text x="915" y="361" text-anchor="middle" fill="#C2B8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">fastmcp</text>
  <text x="915" y="399" text-anchor="middle" fill="#C9C5E7" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20">standalone FastMCP 3</text>

  <path d="M285 437V480" stroke="#59D8FF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M915 437V480" stroke="#9B8CFF" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g filter="url(#shadow)">
    <rect x="75" y="486" width="420" height="142" rx="20" fill="#102A43" stroke="#3A7392"/>
    <rect x="705" y="486" width="420" height="142" rx="20" fill="#202A4D" stroke="#675D9C"/>
  </g>
  <rect x="101" y="510" width="104" height="31" rx="15" fill="#164866"/>
  <text x="153" y="532" text-anchor="middle" fill="#8AE8FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="700">지금 할 일</text>
  <text x="101" y="576" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="700">① mcp&lt;2로 현재 배포 보호</text>
  <text x="101" y="608" fill="#B9CEE3" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19">② 별도 브랜치에서 MCPServer로 이관</text>

  <rect x="731" y="510" width="104" height="31" rx="15" fill="#403B70"/>
  <text x="783" y="532" text-anchor="middle" fill="#CEC7FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="700">지금 할 일</text>
  <text x="731" y="576" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="700">① FastMCP 3 exact pin 유지</text>
  <text x="731" y="608" fill="#CDC9E7" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19">② v4 stable 또는 공식 SDK v2 검토</text>

  <rect x="180" y="679" width="840" height="2" fill="url(#line)"/>
  <text x="600" y="718" text-anchor="middle" fill="#DDE9F6" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="700">같은 FastMCP 이름 ≠ 같은 업그레이드 경로</text>
</svg>
