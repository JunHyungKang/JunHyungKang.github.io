<svg width="1200" height="690" viewBox="0 0 1200 690" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP 2025 계열과 2026 계열의 요청 수명주기 비교</title>
  <desc id="desc">2025 계열은 initialize handshake와 session id를 사용하고, 2026 계열은 server discover 후 각 요청의 meta에 protocol version과 capability를 포함하는 차이를 보여준다. MCPServer v2는 두 경로를 모두 지원한다.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1130" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182E"/>
      <stop offset="1" stop-color="#10294A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000B18" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#85A3C3"/>
    </marker>
    <marker id="arrowBright" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#68DFFF"/>
    </marker>
  </defs>

  <rect width="1200" height="690" rx="30" fill="url(#background)"/>
  <text x="64" y="69" fill="#76DFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" letter-spacing="2">REQUEST LIFECYCLE</text>
  <text x="64" y="123" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="40" font-weight="800">session을 맺던 요청에서, 요청마다 자신을 설명하는 방식으로</text>

  <g filter="url(#shadow)">
    <rect x="60" y="163" width="516" height="398" rx="23" fill="#102A46" stroke="#365B7E"/>
    <rect x="624" y="163" width="516" height="398" rx="23" fill="#132D4A" stroke="#3B7894"/>
  </g>

  <rect x="88" y="188" width="152" height="34" rx="17" fill="#203C5A"/>
  <text x="164" y="212" text-anchor="middle" fill="#B9CEE5" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">2025 계열</text>
  <text x="88" y="260" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="800">handshake + session</text>

  <rect x="652" y="188" width="152" height="34" rx="17" fill="#17455F"/>
  <text x="728" y="212" text-anchor="middle" fill="#8DE7FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">2026 계열</text>
  <text x="652" y="260" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="800">sessionless request</text>

  <rect x="90" y="297" width="155" height="53" rx="13" fill="#182F49" stroke="#58728F"/>
  <rect x="391" y="297" width="155" height="53" rx="13" fill="#182F49" stroke="#58728F"/>
  <text x="167" y="330" text-anchor="middle" fill="#E8F1FA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700">Client</text>
  <text x="468" y="330" text-anchor="middle" fill="#E8F1FA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700">Server</text>
  <path d="M245 392H391" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="377" text-anchor="middle" fill="#B8CAE0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">initialize</text>
  <path d="M391 445H245" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="430" text-anchor="middle" fill="#B8CAE0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">initialized</text>
  <path d="M245 498H391" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="483" text-anchor="middle" fill="#D3DFEC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Mcp-Session-Id</text>
  <text x="318" y="538" text-anchor="middle" fill="#8DA7C3" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17">요청이 session과 연결됨</text>

  <rect x="654" y="297" width="155" height="53" rx="13" fill="#16354F" stroke="#4C8AA4"/>
  <rect x="955" y="297" width="155" height="53" rx="13" fill="#16354F" stroke="#4C8AA4"/>
  <text x="731" y="330" text-anchor="middle" fill="#EEFAFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700">Client</text>
  <text x="1032" y="330" text-anchor="middle" fill="#EEFAFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700">Server</text>
  <path d="M809 400H955" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="382" text-anchor="middle" fill="#9BEAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">server/discover</text>
  <path d="M809 470H955" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="447" text-anchor="middle" fill="#E5F8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">request + _meta</text>
  <text x="882" y="497" text-anchor="middle" fill="#A9CDDC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">protocolVersion · capabilities</text>
  <text x="882" y="538" text-anchor="middle" fill="#93BDD0" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17">요청마다 필요한 정보를 포함</text>

  <rect x="120" y="602" width="960" height="48" rx="15" fill="#173554" stroke="#3F6F91"/>
  <text x="600" y="633" text-anchor="middle" fill="#DDEAF6" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700">MCPServer v2는 한 endpoint에서 두 경로를 모두 받는다 · 구형 client는 여전히 session을 사용한다</text>
</svg>
