<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FastMCP import 경로별 MCP Python SDK v2 대응</title>
  <desc id="desc">공식 MCP Python SDK v1의 FastMCP와 별도 패키지인 FastMCP 3은 이름은 같지만 MCP Python SDK v2 대응이 다르다는 내용의 표지.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="44" x2="1080" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182E"/>
      <stop offset="1" stop-color="#10294A"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="408" x2="955" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59D8FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000D1D" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="88" r="210" fill="#3E66FF" fill-opacity="0.09"/>
  <circle cx="88" cy="620" r="245" fill="#00C2FF" fill-opacity="0.07"/>

  <text x="80" y="82" fill="#72DFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">MIGRATION NOTE · 2026-07-28</text>
  <text x="78" y="169" fill="white" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="61" font-weight="800">FastMCP, 모두 v2로?</text>
  <text x="80" y="223" fill="#BDD2ED" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="29" font-weight="600">같은 이름 · 다른 import · 다른 대응</text>

  <g filter="url(#shadow)">
    <rect x="80" y="295" width="455" height="186" rx="22" fill="#102A48" stroke="#31557C"/>
    <rect x="665" y="295" width="455" height="186" rx="22" fill="#102A48" stroke="#31557C"/>
  </g>

  <rect x="111" y="325" width="176" height="34" rx="17" fill="#173B60"/>
  <text x="199" y="348" text-anchor="middle" fill="#B8D5EC" font-family="Arial, sans-serif" font-size="17" font-weight="700">OFFICIAL SDK V1</text>
  <text x="112" y="405" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="800">mcp.server.fastmcp</text>
  <text x="112" y="447" fill="#AFC6E0" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21">먼저 mcp&lt;2로 배포를 보호한다</text>

  <rect x="696" y="325" width="158" height="34" rx="17" fill="#27345F"/>
  <text x="775" y="348" text-anchor="middle" fill="#BEB4FF" font-family="Arial, sans-serif" font-size="17" font-weight="700">STANDALONE</text>
  <text x="697" y="405" fill="white" font-family="Arial, sans-serif" font-size="27" font-weight="800">fastmcp</text>
  <text x="697" y="447" fill="#AFC6E0" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21">FastMCP 3 버전을 고정하고 기다린다</text>

  <rect x="80" y="530" width="1040" height="58" rx="18" fill="#122F50" stroke="url(#accent)"/>
  <text x="600" y="566" text-anchor="middle" fill="#DDEAF7" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="700">import 경로를 확인한 뒤 운영 마이그레이션을 결정한다</text>
</svg>
