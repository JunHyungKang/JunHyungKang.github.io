<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP 2025 계열의 역방향 요청과 2026 계열의 multi-round-trip 비교</title>
  <desc id="desc">2025 계열에서는 MCP server가 열린 tool 호출 안에서 client에 elicitation 요청을 보내고 답을 받는다. 2026 계열에서는 server가 input required를 반환하고 client가 답을 붙여 같은 tool을 다시 호출한다.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1130" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07182E"/>
      <stop offset="1" stop-color="#10294A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000B18" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#85A3C3"/>
    </marker>
    <marker id="arrowBright" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#68DFFF"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#background)"/>
  <text x="64" y="68" fill="#76DFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" letter-spacing="2">ASKING FOR INPUT MID-CALL</text>
  <text x="64" y="122" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="40" font-weight="800">“정말 삭제할까요?”를 묻는 방법이 달라졌다</text>

  <g filter="url(#shadow)">
    <rect x="60" y="164" width="516" height="452" rx="23" fill="#102A46" stroke="#365B7E"/>
    <rect x="624" y="164" width="516" height="452" rx="23" fill="#132D4A" stroke="#3B7894"/>
  </g>

  <rect x="88" y="190" width="152" height="34" rx="17" fill="#203C5A"/>
  <text x="164" y="214" text-anchor="middle" fill="#B9CEE5" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">2025 계열</text>
  <text x="88" y="260" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="800">열린 연결에서 다시 묻는다</text>

  <rect x="652" y="190" width="152" height="34" rx="17" fill="#17455F"/>
  <text x="728" y="214" text-anchor="middle" fill="#8DE7FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">2026 계열</text>
  <text x="652" y="260" fill="#FFFFFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="800">답을 받아 같은 tool을 재호출한다</text>

  <rect x="88" y="294" width="162" height="55" rx="13" fill="#182F49" stroke="#58728F"/>
  <rect x="386" y="294" width="162" height="55" rx="13" fill="#182F49" stroke="#58728F"/>
  <text x="169" y="318" text-anchor="middle" fill="#E8F1FA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">Client</text>
  <text x="169" y="338" text-anchor="middle" fill="#9FB7CE" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">ChatGPT · IDE</text>
  <text x="467" y="318" text-anchor="middle" fill="#E8F1FA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">Server</text>
  <text x="467" y="338" text-anchor="middle" fill="#9FB7CE" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">MCP tool</text>

  <path d="M250 389H386" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="378" text-anchor="middle" fill="#D3DFEC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">delete_files</text>
  <path d="M386 450H250" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="439" text-anchor="middle" fill="#B8CAE0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">elicitation/create</text>
  <path d="M250 511H386" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="500" text-anchor="middle" fill="#D3DFEC" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16">“예, 삭제”</text>
  <path d="M386 572H250" stroke="#85A3C3" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <text x="318" y="561" text-anchor="middle" fill="#D3DFEC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">complete</text>

  <rect x="652" y="294" width="162" height="55" rx="13" fill="#16354F" stroke="#4C8AA4"/>
  <rect x="950" y="294" width="162" height="55" rx="13" fill="#16354F" stroke="#4C8AA4"/>
  <text x="733" y="318" text-anchor="middle" fill="#EEFAFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">Client</text>
  <text x="733" y="338" text-anchor="middle" fill="#A6C7D6" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">ChatGPT · IDE</text>
  <text x="1031" y="318" text-anchor="middle" fill="#EEFAFF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">Server</text>
  <text x="1031" y="338" text-anchor="middle" fill="#A6C7D6" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">MCP tool</text>

  <path d="M814 389H950" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="378" text-anchor="middle" fill="#E5F8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">delete_files</text>
  <path d="M950 450H814" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="439" text-anchor="middle" fill="#9BEAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">input_required</text>
  <path d="M814 511H950" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="500" text-anchor="middle" fill="#E5F8FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15">같은 tool + “예”</text>
  <path d="M950 572H814" stroke="#68DFFF" stroke-width="3" marker-end="url(#arrowBright)"/>
  <text x="882" y="561" text-anchor="middle" fill="#E5F8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">complete</text>

  <rect x="104" y="654" width="992" height="62" rx="18" fill="#173554" stroke="#3F6F91"/>
  <text x="600" y="681" text-anchor="middle" fill="#8EE7FF" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" font-weight="700">기능은 남아 있다</text>
  <text x="600" y="705" text-anchor="middle" fill="#E5F1FA" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="800">server가 역방향으로 호출하던 방식이, client가 같은 요청을 다시 보내는 방식으로 바뀌었다</text>
</svg>
